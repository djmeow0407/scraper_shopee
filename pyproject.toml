[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopee-scraper"
version = "0.2.0"
description = "Thu thập sản phẩm và đánh giá từ Shopee.vn, xuất ra JSON có cấu trúc cho pipeline ABSA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ton Dai Quoc" }]
keywords = ["shopee", "scraper", "selenium", "vietnamese", "absa"]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "selenium>=4.20",
    "undetected-chromedriver>=3.5",
    # undetected-chromedriver còn import distutils, thứ đã bị gỡ khỏi Python 3.12.
    # setuptools cung cấp bản thay thế qua distutils-precedence.pth.
    "setuptools>=69; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
shopee = "shopee_scraper.cli:app"

[project.urls]
Repository = "https://github.com/tonquoc0407/scraper_shopee"

[tool.hatch.build.targets.wheel]
packages = ["src/shopee_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
