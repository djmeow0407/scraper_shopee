[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopee-scraper"
version = "0.3.0"
description = "Thu thập sản phẩm và đánh giá từ Shopee.vn, xuất ra JSON có cấu trúc cho pipeline ABSA"
readme = "README.md"
# nodriver sinh file CDP có byte non-UTF-8 mà Python 3.14 từ chối biên dịch.
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Ton Dai Quoc" }]
keywords = ["shopee", "scraper", "nodriver", "vietnamese", "absa"]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "nodriver>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
shopee = "shopee_scraper.cli:app"

[project.urls]
Repository = "https://github.com/tonquoc0407/scraper_shopee"

[tool.hatch.build.targets.wheel]
packages = ["src/shopee_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
